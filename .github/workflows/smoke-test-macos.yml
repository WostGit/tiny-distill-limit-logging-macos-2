name: tiny-distill-smoke-macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RUNNER_LABEL: "macos-15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train tiny distillation smoke test
        run: |
          python scripts/train_tiny_distill.py \
            --runner-label "${RUNNER_LABEL}" \
            --metrics-path outputs/metrics/train_metrics.json

      - name: Evaluate tiny adapter
        run: |
          python scripts/eval_tiny_distill.py \
            --runner-label "${RUNNER_LABEL}" \
            --metrics-path outputs/metrics/eval_metrics.json

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiny-distill-metrics-macos
          path: outputs/metrics/*.json
